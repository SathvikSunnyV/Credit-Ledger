name: Daily Loan Check

on:
  schedule:
    # Primary run: 9:00 AM IST = 3:30 AM UTC
    - cron: '30 3 * * *'
    # Safety-net run: 15 min later, in case the primary run was delayed/skipped
    # by GitHub's scheduler (it doesn't guarantee exact timing). This is safe to
    # run even if the primary run already succeeded - the app itself will not
    # send a duplicate email for the same day.
    - cron: '45 3 * * *'

  # Allows manual testing from the Actions tab
  workflow_dispatch:

jobs:
  trigger-check:
    runs-on: ubuntu-latest

    steps:
      - name: Wake Render and wait until it responds
        run: |
          URL="https://credit-ledger-eqrh.onrender.com"
          echo "Waking Render..."
          for i in $(seq 1 15); do
            if curl -fsS -m 15 "$URL/api/health" > /dev/null; then
              echo "Render responded on attempt $i - awake."
              exit 0
            fi
            echo "Not ready yet (attempt $i/15), retrying in 10s..."
            sleep 10
          done
          echo "Render never responded after ~2.5 minutes."
          exit 1

      - name: Trigger the daily loan check
        run: |
          URL="https://credit-ledger-eqrh.onrender.com"
          echo "Triggering /api/run-check..."
          for i in $(seq 1 5); do
            if curl -fsS -m 30 -X POST "$URL/api/run-check" \
                -H "Content-Type: application/json" \
                -H "x-dashboard-password: ${{ secrets.DASHBOARD_PASSWORD }}"; then
              echo ""
              echo "Check triggered successfully."
              exit 0
            fi
            echo "Attempt $i/5 failed, retrying in 10s..."
            sleep 10
          done
          echo "Failed to trigger the check after 5 attempts."
          exit 1
          